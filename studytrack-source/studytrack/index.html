<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StudyTrack - Your Study. Your Progress.</title>
    <meta name="description" content="StudyTrack records and explains your daily study time. Works offline. Your data stays on your device." />
    <meta name="theme-color" content="#FCF7EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyTrack" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('studytrack.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fcf7eb; z-index: 100; }
      .dark #boot { background: #141a16; }
      #boot img { width: 96px; height: 96px; border-radius: 22px; animation: bootpulse 1.4s ease-in-out infinite; }
      @keyframes bootpulse { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot"><img src="./icons/icon-192.png" alt="StudyTrack" /></div>
    <div id="root"></div>
    <noscript>StudyTrack needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
